<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>太阳系 · 实时轨道</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020407; color: #dce8f2; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <p>正在加载太阳系页面…</p>
  <script>
    (async () => {
      try {
        const paths = [
          "./solar-system-source-v2-part-01.b64",
          "./solar-system-source-v2-part-02.b64",
          "./solar-system-source-v2-part-03.b64",
          "./solar-system-source-v2-part-04.b64"
        ];
        const responses = await Promise.all(paths.map(path => fetch(path)));
        if (responses.some(response => !response.ok) || !("DecompressionStream" in window)) throw new Error();
        const encoded = (await Promise.all(responses.map(response => response.text()))).join("").trim();
        const compressed = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch {
        document.body.innerHTML = "<p>页面加载失败。请确认已通过静态网页服务器访问，并使用较新的浏览器。</p>";
      }
    })();
  </script>
</body>
</html>
